[pytest]
# The RoboStack Jazzy env ships launch_testing / launch_ros pytest plugins whose
# hookimpls are incompatible with the env's pytest 9; loading either aborts
# every pytest run before collection. These tests don't use launch_testing, so
# disable both plugins here. See ERRORS.md (2026-07-07).
addopts = -p no:launch_testing -p no:launch_ros
