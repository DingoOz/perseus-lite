# Velocity arbitration for Perseus Lite (hardware bringup and simulation).
# Every input is geometry_msgs/TwistStamped; the output is remapped to /cmd_vel
# (the diff_drive_base_controller input) by launch/twist_mux.launch.py.
# Higher priority wins while its topic is active; an input is dropped when it
# has not published for `timeout` seconds.
twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      joystick:
        topic: /joy_vel
        timeout: 0.5
        priority: 100
      keyboard:
        topic: /key_vel
        timeout: 0.5
        priority: 90
      web_ui:
        topic: /web_vel
        timeout: 0.5
        priority: 80
      navigation:
        topic: /cmd_vel_nav_stamped # collision_monitor output
        timeout: 0.5
        priority: 10
