controller_manager:
  ros__parameters:
    update_rate: 50
    lock_memory: False
    # Define controllers under the "controllers" key
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_base_controller:
      type: diff_drive_controller/DiffDriveController
# Parameters for individual controllers
diff_drive_base_controller:
  ros__parameters:
    # Hardware configuration
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]
    # Effective skid-steer separation calibrated on the robot (the geometric
    # track is 0.376 m; wheel scrub makes the kinematic value much larger).
    wheel_separation: 0.8286
    wheels_per_side: 2
    wheel_radius: 0.0725
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    open_loop: false # Use encoder feedback for odometry
    position_feedback: false # Use the velocity state interface directly (requires calibrated servo_max_rpm)
    # ROS I/O configuration
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: false # The EKF publishes odom->base_link
    cmd_vel_timeout: 0.5
    # Kinematic limits (conservative for a 50%-scale rover in sand; verify on
    # hardware before raising)
    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 1.0
    linear.x.max_deceleration: -1.0
    linear.x.max_jerk: .NAN
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.max_acceleration: 3.0
    angular.z.max_deceleration: -3.0
    angular.z.max_jerk: .NAN
