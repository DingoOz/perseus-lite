# depthai_ros_driver parameters for the Perseus Lite OAK-D Lite, tuned for terrain
# mapping (perseus_terrain), not for imaging. Used by launch/oak_d_lite.launch.py,
# which runs in the `camera` Pixi env: `pixi run -e camera oak`.
/oak:
  ros__parameters:
    camera:
      # Stereo depth only: no RGB stream, no on-device neural network. Saves
      # USB bandwidth and the onboard computer's CPU.
      i_pipeline_type: DEPTH
      i_nn_type: none
      i_enable_imu: false
      # The OAK-D Lite has no IR projector or flood light.
      i_enable_ir: false
      # The robot's URDF (perseus_lite_description/urdf/sensors.urdf.xacro) owns
      # the oak_* frames; the driver must not publish its own.
      i_publish_tf_from_calibration: false
    left:
      i_resolution: 480P # OV7251 mono sensors: 640x480
      i_fps: 10.0
    right:
      i_resolution: 480P
      i_fps: 10.0
    stereo:
      # Leave depth in the right camera's frame (oak_right_camera_optical_frame);
      # aligning it to the RGB camera would need the RGB pipeline running.
      i_align_depth: false
      i_subpixel: true # finer disparity steps: less depth quantisation far out
      i_lr_check: true # drops occluded/mismatched pixels instead of guessing
      i_depth_preset: ROBOTICS
      # On-device filters. Speckle removes the isolated blobs stereo produces on
      # low-texture sand; the threshold filter drops depth the terrain mapper
      # would discard anyway (it gates again at min/max_depth_m).
      i_enable_speckle_filter: true
      i_enable_spatial_filter: false
      # Temporal filtering smears depth while the robot moves.
      i_enable_temporal_filter: false
      i_enable_threshold_filter: true
      i_threshold_filter_min_range: 300 # mm
      i_threshold_filter_max_range: 4000 # mm
      i_enable_decimation_filter: false # terrain_mapper decimates (pixel_stride)
      i_publish_topic: true
