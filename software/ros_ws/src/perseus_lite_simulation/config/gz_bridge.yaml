# partially taken from Articubot One project by Articulated Robotics
# see: https://github.com/joshnewans/articubot_one/tree/new_gazebo
#
# TF is NOT bridged: robot_state_publisher, the EKF (odom -> base_link) and
# slam_toolbox (map -> odom) own it, exactly as on the robot. Joint states
# come from ros2_control's joint_state_broadcaster.
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
# 2D lidar (republished as /scan_filtered by scan_range_filter)
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
# IMU (the URDF's gz sensor publishes on imu/data, matching the real i2c_imu)
- ros_topic_name: "imu/data"
  gz_topic_name: "imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
# OAK-D Lite stereo depth (the URDF's rgbd_camera at the right lens). Same ROS
# topics and frame as depthai_ros_driver on the robot, so terrain_mapper runs
# unchanged. The colour image and point cloud are deliberately not bridged:
# nothing consumes them and they dominate the bridge's CPU.
- ros_topic_name: "/oak/stereo/image_raw"
  gz_topic_name: "oak/stereo/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/oak/stereo/camera_info"
  gz_topic_name: "oak/stereo/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
