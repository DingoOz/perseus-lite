# Teleop Diagnostics Configuration
#
# Loaded by launch/teleop_diagnostics.launch.py. wheel.* and mux_priorities.*
# are read by the node (mux priorities are then refreshed from /twist_mux if it
# is running); the rest documents the expected teleop chain for reference.
teleop_diagnostics:
  ros__parameters:
    # perseus-lite wheel geometry. separation is the *effective* skid-steer
    # separation calibrated on the robot (the geometric track is 0.376 m).
    wheel:
      axis: 'xyz="0 1 0"' # Positive Y axis
      axis_comment: "Positive velocity = forward motion (ROS REP-103 convention)"
      separation: 0.8286 # meters (calibrated effective)
      radius: 0.0725 # meters
    # Twist mux priorities (perseus_lite twist_mux config)
    mux_priorities:
      joystick: 100 # joy_vel - highest priority
      keyboard: 90 # key_vel
      web_ui: 80 # web_vel
      navigation: 10 # cmd_vel_nav_stamped - lowest priority
    # Generic controller config (from perseus_input_config/config/xbox_controller_wired.yaml)
    controller:
      forward:
        axis: 1
        scaling: 0.7 # Positive: joystick forward = positive cmd_vel (ROS convention)
        enable_axis: 2
        enable_threshold: -0.5
      turn:
        axis: 0
        scaling: 0.5 # Positive: joystick left = positive angular.z (ROS convention)
      turbo:
        enable_axis: 5
        enable_threshold: -0.5
        scaling: 2.0
    # Topic chain (all TwistStamped on Jazzy)
    topics:
      joy_input: "/joy"
      joy_vel: "/joy_vel"
      cmd_vel: "/cmd_vel" # twist_mux output -> diff_drive_base_controller
      joint_states: "/joint_states"
