# Pixi CI: format check, build + unit tests on x86_64 and ARM64.
# Replaces the former Nix/Cachix pipeline. ROS 2 Jazzy and all deps come from
# the robostack-jazzy conda channel via Pixi; pixi.lock pins exact versions.
name: CI
on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
# Superseded PR pushes cancel their older run. Every other event (pushes to
# main, merge queue, dispatch) gets its own group (keyed on run_id) so it is
# never cancelled — not even while pending, which a shared group would do —
# and every main commit gets a CI result (the Pages deploy is gated on it).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: prefix-dev/setup-pixi@14c8aabd75893f83f4ab30c03e7cf853c8208961 # v0.8.10
        with:
          environments: format
          cache: true
      - name: treefmt --ci
        run: pixi run -e format fmt-check
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --std=c++20 \
            --inline-suppr --error-exitcode=1 \
            software/ros_ws/src software/shared software/arm-teleop-direct
  build:
    name: Build + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: prefix-dev/setup-pixi@14c8aabd75893f83f4ab30c03e7cf853c8208961 # v0.8.10
        with:
          environments: default
          cache: true
      - name: Build workspace
        run: pixi run -e default build-test
      - name: Run unit tests
        run: pixi run -e default test
  build-sim:
    name: Build + test simulation (linux-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: prefix-dev/setup-pixi@14c8aabd75893f83f4ab30c03e7cf853c8208961 # v0.8.10
        with:
          environments: simulation
          cache: true
      - name: Build workspace (with Gazebo)
        run: pixi run -e simulation build-test
      - name: Run unit tests
        run: pixi run -e simulation test
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: prefix-dev/setup-pixi@14c8aabd75893f83f4ab30c03e7cf853c8208961 # v0.8.10
        with:
          environments: docs
          cache: true
      - name: Build docs
        run: pixi run -e docs docs
  compose-validate:
    name: Validate Isaac compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate docker compose
        run: docker compose -f software/docker/isaac-ros/compose.yaml config -q
